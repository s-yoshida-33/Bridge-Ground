<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリ詳細 - BridgeGround</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        #header {
            background: #1a2233;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            height: 52px;
        }
        #header a { color: #8899bb; text-decoration: none; font-size: 13px; }
        #header a:hover { color: #fff; }
        #header .sep { color: #445; }
        #header h1 { font-size: 16px; font-weight: 600; }

        #content { padding: 24px 20px; max-width: 900px; margin: 0 auto; }

        .card {
            background: #fff;
            border: 1px solid #dde2ea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h3 {
            font-size: 14px; font-weight: 600; color: #1a2233;
            margin-bottom: 16px; padding-bottom: 10px;
            border-bottom: 1px solid #eef0f4;
        }

        /* App header */
        .app-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .status-dot.online  { background: #20a852; box-shadow: 0 0 0 3px rgba(32,168,82,.15); }
        .status-dot.offline { background: #bbb; }
        .app-name { font-size: 22px; font-weight: 700; color: #1a2233; }
        .status-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        .status-badge.online  { background: #eafaf1; color: #1a7a3f; }
        .status-badge.offline { background: #f5f7fa; color: #889; }

        /* Info grid */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .info-label { font-size: 11px; font-weight: 600; color: #778; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
        .info-value { font-size: 14px; color: #223; font-weight: 500; }
        .info-value.mono { font-family: monospace; font-size: 13px; }

        /* Screenshot card */
        .screenshot-card {
            background: #fff;
            border: 1px solid #dde2ea;
            border-radius: 8px;
            padding: 24px 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .screenshot-card h3 {
            align-self: flex-start;
            font-size: 14px; font-weight: 600; color: #1a2233;
            padding-bottom: 10px;
            border-bottom: 1px solid #eef0f4;
            width: 100%;
            margin-bottom: 6px;
        }
        #capture-btn {
            background: #1a6ef5; color: #fff;
            border: none; border-radius: 5px;
            font-size: 14px; font-weight: 600;
            padding: 10px 28px;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }
        #capture-btn:hover:not(:disabled) { background: #0f5de0; }
        #capture-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #capture-status { font-size: 12px; color: #889; min-height: 18px; }

        /* Screenshot popup (modal) */
        #screenshot-modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #screenshot-modal.open { display: flex; }
        .modal-box {
            background: #1a1e2b;
            border-radius: 10px;
            max-width: 92vw;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2e3d;
        }
        .modal-header span { color: #c8d0e0; font-size: 13px; font-weight: 600; }
        .modal-header-actions { display: flex; gap: 8px; align-items: center; }
        #modal-download-btn {
            background: #1a6ef5; color: #fff;
            border: none; border-radius: 5px;
            font-size: 12px; font-weight: 600;
            padding: 6px 14px;
            cursor: pointer;
        }
        #modal-download-btn:hover { background: #0f5de0; }
        #modal-close-btn {
            background: #2a2e3d; color: #c8d0e0;
            border: none; border-radius: 5px;
            font-size: 16px; font-weight: 700;
            width: 30px; height: 30px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #modal-close-btn:hover { background: #3a3e4d; }
        .modal-body { overflow: auto; padding: 8px; }
        #screenshot-preview { max-width: 100%; max-height: calc(92vh - 80px); display: block; border-radius: 4px; }

        /* Log section */
        #log-toolbar {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 12px; flex-wrap: wrap;
        }
        .date-input {
            padding: 5px 8px; border: 1px solid #cdd2da;
            border-radius: 5px; font-size: 13px; color: #334; background: #fff;
        }
        .date-input:focus { outline: none; border-color: #1a6ef5; }
        .date-sep { font-size: 13px; color: #778; }
        .log-filter-btn {
            padding: 4px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 600;
            background: #eef0f4; color: #556; border: none; cursor: pointer;
        }
        .log-filter-btn.active { background: #1a6ef5; color: #fff; }
        .log-filter-btn.warn  { color: #b85c00; }
        .log-filter-btn.warn.active  { background: #f5a623; color: #fff; }
        .log-filter-btn.error { color: #c0392b; }
        .log-filter-btn.error.active { background: #e74c3c; color: #fff; }

        button { cursor: pointer; border: none; border-radius: 5px; font-size: 13px; font-weight: 500; padding: 6px 14px; transition: background 0.15s; }
        .btn-secondary { background: #eef0f4; color: #445; }
        .btn-secondary:hover { background: #dde2ea; }

        #log-count { font-size: 12px; color: #889; margin-left: auto; }
        #auto-refresh-indicator { display: none; font-size: 11px; color: #20a852; font-weight: 600; }

        #log-container {
            font-family: "Consolas", "Cascadia Code", monospace;
            font-size: 12px; background: #1a1e2b; color: #c8d0e0;
            border-radius: 6px; padding: 12px;
            height: 480px; overflow-y: auto; line-height: 1.6;
        }
        .log-entry { display: flex; gap: 8px; padding: 1px 0; }
        .log-entry:hover { background: rgba(255,255,255,0.04); }
        .log-ts  { color: #556a8a; flex-shrink: 0; }
        .log-tag { color: #7cb8e8; flex-shrink: 0; min-width: 120px; }
        .log-msg { word-break: break-all; }
        .log-level-badge { flex-shrink: 0; width: 42px; text-align: center; }
        .log-level-info  .log-level-badge { color: #5dade2; }
        .log-level-warn  .log-level-badge, .log-level-warn  .log-msg { color: #f0a830; }
        .log-level-error .log-level-badge, .log-level-error .log-msg { color: #e74c3c; }
        .log-level-fatal .log-level-badge, .log-level-fatal .log-msg { color: #ff6b6b; font-weight: 700; }
        .log-empty { color: #556a8a; text-align: center; padding: 40px 0; }

        #error-view { display: none; }
    </style>
</head>
<body>
    <div id="header">
        <a href="/">← BridgeGround</a>
        <span class="sep">/</span>
        <h1 id="app-title">アプリ詳細</h1>
    </div>

    <div id="content">
        <div id="error-view" class="card" style="color:#c0392b;">
            アプリ情報を取得できませんでした。URLのIDを確認してください。
        </div>

        <div id="main-view">
            <!-- App header -->
            <div class="card">
                <div class="app-header">
                    <span class="status-dot" id="status-dot"></span>
                    <span class="app-name" id="app-name">-</span>
                    <span class="status-badge" id="status-badge">-</span>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">バージョン</div>
                        <div class="info-value mono" id="info-version">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">モール ID</div>
                        <div class="info-value mono" id="info-mallid">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">ホスト名</div>
                        <div class="info-value mono" id="info-hostname">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">稼働時間</div>
                        <div class="info-value" id="info-uptime">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">起動日時</div>
                        <div class="info-value" id="info-started">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">最終接続</div>
                        <div class="info-value" id="info-lastseen">-</div>
                    </div>
                </div>
            </div>

            <!-- Screenshot -->
            <div class="screenshot-card">
                <h3>スクリーンショット</h3>
                <button id="capture-btn">スクリーンショットを取得</button>
                <span id="capture-status"></span>
            </div>

            <!-- Screenshot modal -->
            <div id="screenshot-modal">
                <div class="modal-box">
                    <div class="modal-header">
                        <span id="modal-timestamp"></span>
                        <div class="modal-header-actions">
                            <button id="modal-download-btn">ダウンロード</button>
                            <button id="modal-close-btn">×</button>
                        </div>
                    </div>
                    <div class="modal-body">
                        <img id="screenshot-preview" src="" alt="スクリーンショット">
                    </div>
                </div>
            </div>

            <!-- Log view -->
            <div class="card">
                <h3 id="log-card-title">アプリログ</h3>
                <div id="log-toolbar">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span class="date-sep">期間</span>
                        <input type="date" id="log-date-from" class="date-input">
                        <span class="date-sep">〜</span>
                        <input type="date" id="log-date-to" class="date-input">
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <button class="log-filter-btn active" data-level="ALL">ALL</button>
                        <button class="log-filter-btn" data-level="INFO">INFO</button>
                        <button class="log-filter-btn warn" data-level="WARN">WARN</button>
                        <button class="log-filter-btn error" data-level="ERROR">ERROR / FATAL</button>
                    </div>
                    <button id="log-refresh-btn" class="btn-secondary">更新</button>
                    <button id="log-download-btn" class="btn-secondary">ダウンロード</button>
                    <span id="log-count"></span>
                    <span id="auto-refresh-indicator">● 自動更新中</span>
                </div>
                <div id="log-container"><div class="log-empty">読み込み中...</div></div>
            </div>
        </div>
    </div>

    <script>
    (async () => {
        const params = new URLSearchParams(location.search);
        const appId  = params.get('id');
        if (!appId) { showError(); return; }

        // --- App info ---
        let appInfo = null;
        let appName = 'アプリ';

        async function loadApp() {
            try {
                const r = await fetch('/api/apps/' + appId);
                if (!r.ok) { showError(); return; }
                appInfo = await r.json();
                renderApp(appInfo);
            } catch { showError(); }
        }

        function showError() {
            document.getElementById('main-view').style.display  = 'none';
            document.getElementById('error-view').style.display = 'block';
        }

        function formatUptime(startedAt) {
            if (!startedAt) return '-';
            const ms = Date.now() - new Date(startedAt).getTime();
            if (ms < 0) return '-';
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            if (h > 0) return h + '時間 ' + m + '分';
            if (m > 0) return m + '分 ' + s + '秒';
            return s + '秒';
        }

        function renderApp(a) {
            appName = a.name || 'アプリ';
            document.title = appName + ' - BridgeGround';
            document.getElementById('app-title').textContent    = appName;
            document.getElementById('app-name').textContent     = appName;
            document.getElementById('info-version').textContent = a.version  || '-';
            document.getElementById('info-mallid').textContent  = a.mallId   || '-';
            document.getElementById('info-hostname').textContent= a.hostname || '-';
            document.getElementById('info-started').textContent = a.startedAt ? fmtDate(a.startedAt) : '-';
            document.getElementById('info-lastseen').textContent= fmtDate(a.lastSeen);
            document.getElementById('log-card-title').textContent = appName + ' ログ';

            const dot   = document.getElementById('status-dot');
            const badge = document.getElementById('status-badge');
            if (a.online) {
                dot.className   = 'status-dot online';
                badge.className = 'status-badge online';
                badge.textContent = 'オンライン';
            } else {
                dot.className   = 'status-dot offline';
                badge.className = 'status-badge offline';
                badge.textContent = 'オフライン';
            }
        }

        function fmtDate(iso) {
            if (!iso) return '-';
            try { return new Date(iso).toLocaleString('ja-JP'); } catch { return iso; }
        }

        await loadApp();
        setInterval(loadApp, 10000);

        // Update uptime display every second
        setInterval(() => {
            if (appInfo && appInfo.startedAt) {
                document.getElementById('info-uptime').textContent = formatUptime(appInfo.startedAt);
            }
        }, 1000);

        // --- Screenshot ---
        const captureBtn    = document.getElementById('capture-btn');
        const captureStatus = document.getElementById('capture-status');
        const modal         = document.getElementById('screenshot-modal');
        const preview       = document.getElementById('screenshot-preview');
        const modalTs       = document.getElementById('modal-timestamp');
        const modalDL       = document.getElementById('modal-download-btn');
        const modalClose    = document.getElementById('modal-close-btn');

        let screenshotUrl = null;

        function openModal(imgUrl, at) {
            if (screenshotUrl) URL.revokeObjectURL(screenshotUrl);
            screenshotUrl = imgUrl;
            preview.src = imgUrl;
            modalTs.textContent = at ? '取得: ' + fmtDate(at) : '';
            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        modalClose.addEventListener('click', closeModal);

        modalDL.addEventListener('click', () => {
            if (!screenshotUrl) return;
            const a = document.createElement('a');
            a.href = screenshotUrl;
            const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
            a.download = (appName || 'screenshot') + '-' + ts + '.jpg';
            a.click();
        });

        captureBtn.addEventListener('click', async () => {
            captureBtn.disabled = true;
            captureStatus.textContent = '取得中... (最大15秒)';

            try {
                const reqRes = await fetch('/api/apps/' + appId + '/screenshot/request', { method: 'POST' });
                if (!reqRes.ok) throw new Error('request failed');

                // Poll status for up to 15 seconds
                let ready = false;
                let at = null;
                for (let i = 0; i < 15; i++) {
                    await new Promise(r => setTimeout(r, 1000));
                    const s = await fetch('/api/apps/' + appId + '/screenshot/status');
                    const data = await s.json();
                    if (data.ready) { ready = true; at = data.at; break; }
                }

                if (!ready) throw new Error('timeout');

                const imgRes = await fetch('/api/apps/' + appId + '/screenshot?t=' + Date.now());
                if (!imgRes.ok) throw new Error('fetch screenshot failed');
                const blob = await imgRes.blob();
                const url  = URL.createObjectURL(blob);
                captureStatus.textContent = '';
                openModal(url, at);
            } catch (e) {
                captureStatus.textContent = '取得に失敗しました。アプリがオンラインか確認してください。';
            } finally {
                captureBtn.disabled = false;
            }
        });

        // --- Log section ---
        let allEntries  = [];
        let activeLevel = 'ALL';
        let autoTimer   = null;

        const logContainer  = document.getElementById('log-container');
        const logCountEl    = document.getElementById('log-count');
        const logDateFrom   = document.getElementById('log-date-from');
        const logDateTo     = document.getElementById('log-date-to');
        const filterButtons = document.querySelectorAll('.log-filter-btn');
        const refreshBtn    = document.getElementById('log-refresh-btn');
        const downloadBtn   = document.getElementById('log-download-btn');

        const todayStr = new Date().toISOString().slice(0, 10);
        const minDate  = (() => { const d = new Date(); d.setDate(d.getDate() - 30); return d.toISOString().slice(0, 10); })();
        logDateFrom.value = todayStr; logDateTo.value = todayStr;
        logDateFrom.min   = minDate;  logDateTo.min   = minDate;
        logDateFrom.max   = todayStr; logDateTo.max   = todayStr;

        logDateFrom.addEventListener('change', () => {
            if (logDateFrom.value > logDateTo.value) logDateTo.value = logDateFrom.value;
            loadLogs(); startAutoRefresh();
        });
        logDateTo.addEventListener('change', () => {
            if (logDateTo.value < logDateFrom.value) logDateFrom.value = logDateTo.value;
            loadLogs(); startAutoRefresh();
        });
        filterButtons.forEach(b => b.addEventListener('click', () => {
            activeLevel = b.dataset.level;
            filterButtons.forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            renderLogs(false);
        }));
        refreshBtn.addEventListener('click', loadLogs);
        downloadBtn.addEventListener('click', downloadLogs);

        async function loadLogs() {
            logContainer.innerHTML = '<div class="log-empty">読み込み中...</div>';
            try {
                const p = new URLSearchParams({ from: logDateFrom.value, to: logDateTo.value });
                const r = await fetch('/api/apps/' + appId + '/logs?' + p);
                allEntries = await r.json();
                renderLogs(true);
            } catch {
                logContainer.innerHTML = '<div class="log-empty">ログの読み込みに失敗しました。</div>';
            }
        }

        function renderLogs(scrollToBottom) {
            const filtered = activeLevel === 'ALL'
                ? allEntries
                : allEntries.filter(e => activeLevel === 'ERROR'
                    ? (e.level === 'ERROR' || e.level === 'FATAL')
                    : e.level === activeLevel);

            logCountEl.textContent = filtered.length + ' 件';
            if (filtered.length === 0) {
                logContainer.innerHTML = '<div class="log-empty">該当するエントリがありません。</div>';
                return;
            }
            logContainer.innerHTML = filtered.map(e => {
                const lvl   = (e.level || '').toUpperCase();
                const cls   = lvl ? 'log-level-' + lvl.toLowerCase() : '';
                const ts    = e.timestamp ? '<span class="log-ts">' + esc(e.timestamp) + '</span>' : '';
                const badge = lvl ? '<span class="log-level-badge">[' + esc(lvl) + ']</span>' : '';
                const tag   = e.tag ? '<span class="log-tag">[' + esc(e.tag) + ']</span>' : '';
                const msg   = '<span class="log-msg">' + esc(e.message || '') + '</span>';
                return '<div class="log-entry ' + cls + '">' + ts + badge + tag + msg + '</div>';
            }).join('');
            if (scrollToBottom) logContainer.scrollTop = logContainer.scrollHeight;
        }

        function downloadLogs() {
            if (!allEntries.length) return;
            const lines = allEntries.map(e =>
                (e.timestamp && e.level && e.tag)
                    ? '[' + e.timestamp + '] [' + e.level + '] [' + e.tag + '] ' + e.message
                    : (e.message || '')
            );
            const blob = new Blob([lines.join('\n')], { type: 'text/plain; charset=utf-8' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url;
            const from = logDateFrom.value, to = logDateTo.value;
            const name = (appName || 'app').toLowerCase().replace(/\s+/g, '-');
            a.download = from === to ? name + '-' + from + '.log' : name + '-' + from + '_to_' + to + '.log';
            a.click();
            URL.revokeObjectURL(url);
        }

        function startAutoRefresh() {
            if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
            const today = new Date().toISOString().slice(0, 10);
            const indEl = document.getElementById('auto-refresh-indicator');
            if (logDateTo.value !== today) { indEl.style.display = 'none'; return; }
            autoTimer = setInterval(async () => {
                try {
                    const p = new URLSearchParams({ from: logDateFrom.value, to: logDateTo.value });
                    const r = await fetch('/api/apps/' + appId + '/logs?' + p);
                    const fresh = await r.json();
                    if (fresh.length !== allEntries.length) {
                        const atBottom = logContainer.scrollTop + logContainer.clientHeight >= logContainer.scrollHeight - 50;
                        allEntries = fresh;
                        renderLogs(atBottom);
                    }
                } catch (_) {}
            }, 5000);
            indEl.style.display = 'inline';
        }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        await loadLogs();
        startAutoRefresh();
    })();
    </script>
</body>
</html>
